onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+v"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

# Linhas de scrollback por giro do mouse. O herdr captura o mouse (mouse_capture,
# default true), entao e ELE que rola dentro dos paineis, nao o WezTerm — por isso
# um override de wheel no wezterm.lua nao tinha efeito. Default do herdr e 3.
mouse_scroll_lines = 7

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
